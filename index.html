<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraScale AI - V2.96 PRO API (Standalone)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = '<div style="color:red; padding:20px; font-size:20px; background:black;"><h1>啟動失敗</h1><p>' + msg + '</p><p>Line: ' + line + '</p></div>';
        };
    </script>

    <style>
        :root { 
            --bg: #0b0e14;
            --card: #161b22; 
            --input: #0d1117; 
            --text: #c9d1d9; 
            --secondary: #58a6ff; 
            --success: #238636; 
            --warning: #d29922;
        }
        body { margin: 0; background-color: var(--bg); color: var(--text);
        font-family: "Segoe UI", Roboto, sans-serif; }
        
        .v14-section { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; }
        .v14-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: flex-end; }
        .v14-col { flex: 1; min-width: 150px; }
        .v14-label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #8b949e; }
        .v14-input, .v14-select { width: 100%; padding: 8px; background: var(--input); border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .v14-btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 13px; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .v14-btn-save { background: var(--success); color: white; }
        .v14-btn-del { background: #da3633; color: white; }
        .v14-btn-scan { background: var(--warning); color: #000; }
        
        .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background: #8b949e; }
        .status-ok { background: var(--success); box-shadow: 0 0 5px var(--success); }
        .status-error { background: #da3633; box-shadow: 0 0 5px #da3633; }

        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .bg-noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E"); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 0. 基礎設定 (Global Access) ---
        const { useState, useRef, useEffect, useCallback } = React;
        const { createRoot } = ReactDOM;

        // --- 1. 內建圖示 (Inline Icons) - 移除外部依賴 ---
        const Icon = ({ path, size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        // 定義所有 SVG 路徑
        const Icons = {
            Upload: <Icon path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
            Sparkles: <Icon path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M7 5h4"/></>} />, // 簡化版星星
            ImageIcon: <Icon path={<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>} />,
            Download: <Icon path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
            Plus: <Icon size={14} path={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />,
            Zap: <Icon size={16} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>} />,
            Shield: <Icon size={16} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></>} />,
            Activity: <Icon size={16} path={<><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></>} />,
            FileImage: <Icon size={14} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="13" r="2"/><path d="m20 17-1.09-1.09a2 2 0 0 0-2.82 0L10 22"/></>} />,
            ZoomIn: <Icon size={12} path={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></>} />,
            Monitor: <Icon size={14} path={<><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></>} />,
            Trash2: <Icon size={14} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Save: <Icon size={14} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />,
            Search: <Icon size={14} path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
            Bot: <Icon size={14} path={<><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></>} />,
            Eraser: <Icon size={14} path={<><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></>} />,
            BeforeAfter: <Icon size={24} path={<><path d="M12 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5" /><line x1="12" y1="4" x2="12" y2="20" /><path d="M16 5h1a2 2 0 0 1 2 2v1" /><line x1="19" y1="12" x2="19" y2="12" /><path d="M19 16v1a2 2 0 0 1-2 2h-1" /></>} />
        };

        const getTimestampFilename = (mode, aiEnabled, watermarkRemoved) => {
          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const dateStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
          const timeStr = `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
          
          let suffix = '_Original';
          if (mode === 'restore') suffix = '_Restored';
          if (mode === 'finetune') suffix = '_Finetuned';
          if (mode === 'optimize') suffix = '_Optimized';
          if (aiEnabled) suffix += '_AI_V2.96';
          if (watermarkRemoved) suffix += '_Clean';

          return `${dateStr}_${timeStr}${suffix}.jpg`;
        };

        const App = () => {
          // --- API State ---
          const [savedKeys, setSavedKeys] = useState({});
          const [currentKey, setCurrentKey] = useState("");
          const [keyName, setKeyName] = useState("");
          const [modelList, setModelList] = useState([]);
          const [selectedModel, setSelectedModel] = useState("gemini-1.5-flash");
          const [apiStatus, setApiStatus] = useState("idle");

          // --- App State ---
          const [originalImage, setOriginalImage] = useState(null);
          const [imgDimensions, setImgDimensions] = useState({ w: 0, h: 0 });
          const [mode, setMode] = useState('optimize'); 
          const [resolution, setResolution] = useState(3840);
          const [enableAI, setEnableAI] = useState(false);
          const [removeWatermark, setRemoveWatermark] = useState(false);
          const [step, setStep] = useState('upload'); 
          const [progress, setProgress] = useState(0);
          const [isExporting, setIsExporting] = useState(false);
          
          const [zoom, setZoom] = useState(1);
          const [pan, setPan] = useState({ x: 0, y: 0 });
          const [isComparing, setIsComparing] = useState(false);
          const [isDraggingImage, setIsDraggingImage] = useState(false);
          const dragStartRef = useRef({ x: 0, y: 0 });
          const containerRef = useRef(null);

          // --- API Logic ---
          useEffect(() => {
              const saved = JSON.parse(localStorage.getItem('v14_api_keys') || '{}');
              setSavedKeys(saved);
          }, []);

          const handleSaveKey = () => {
              if(!currentKey || !keyName) return alert('請輸入 Key 和名稱');
              const newKeys = { ...savedKeys, [keyName]: currentKey };
              localStorage.setItem('v14_api_keys', JSON.stringify(newKeys));
              setSavedKeys(newKeys);
              alert(`已儲存: ${keyName}`);
          };

          const handleDeleteKey = () => {
              const select = document.getElementById('savedKeys');
              if(!select || !select.value) return;
              const name = select.options[select.selectedIndex].text;
              if(confirm(`確定刪除 ${name} 嗎？`)) {
                  const newKeys = { ...savedKeys };
                  delete newKeys[name];
                  localStorage.setItem('v14_api_keys', JSON.stringify(newKeys));
                  setSavedKeys(newKeys);
                  setCurrentKey("");
              }
          };

          const handleLoadKey = (e) => {
              setCurrentKey(e.target.value);
              if(e.target.value) setApiStatus("idle");
          };

          const scanModels = async () => {
              if(!currentKey) return alert('請輸入 Key');
              setApiStatus("scanning");
              try {
                  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${currentKey}`);
                  const data = await res.json();
                  
                  if(data.models) {
                      const models = data.models
                          .filter(m => m.supportedGenerationMethods.includes("generateContent"))
                          .map(m => m.name.replace('models/', ''));
                      setModelList(models);
                      const defaultModel = models.find(m => m.includes('flash')) || models[0];
                      if (defaultModel) setSelectedModel(defaultModel);
                      
                      setApiStatus("ready");
                  } else { 
                      throw new Error("No models found or Invalid Key");
                  }
              } catch (e) { 
                  console.error(e);
                  alert('掃描失敗: 請檢查 Key 是否正確');
                  setApiStatus("error");
              }
          };

          const getPreviewFilter = () => {
            if (mode === 'restore') return 'none';
            if (mode === 'finetune') return 'contrast(1.02) saturate(1.02)';
            if (mode === 'optimize') return 'contrast(1.05) brightness(1.01) saturate(1.02)';
            return 'none';
          };

          // --- 核心渲染與下載邏輯 (V2.96 重大修正: 銳化與強力去浮水印) ---
          const renderAndDownload = async () => {
            if (!originalImage) return;
            setIsExporting(true);

            if ((enableAI || removeWatermark) && apiStatus === 'ready' && currentKey) {
                try {
                    let promptParts = [];
                    promptParts.push("Role: Expert Forensic Image Restorer. Task: Reconstruct the image with MACRO-PHOTOGRAPHY details and perform DESTRUCTIVE EDITING on artifacts.");
                    
                    if (removeWatermark) {
                        promptParts.push(`
                            /// PRIORITY 1: DESTRUCTIVE WATERMARK REMOVAL ///
                            ZONE: Extreme Bottom-Right Corner (Coordinates: X=85%-100%, Y=85%-100%).
                            DETECTION: 'Nano Banana' logo, white text, or star icons.
                            
                            MANDATORY OPERATION (BLIND INPAINTING):
                            1. TREAT THE LOGO AS CORRUPTED DATA. DO NOT 'remove' it; 'OVERWRITE' it.
                            2. HALLUCINATE BACKGROUND: You must invent the missing floor/wall/fabric pattern that is hidden behind the logo.
                            3. SEAMLESS CLONING: Copy texture noise from the center of the image to fill the bottom-right corner.
                            4. PROHIBITED: Do not leave blur, do not leave grey patches. It must be a clean texture replacement.
                        `);
                    }

                    if (enableAI) {
                        const targetRes = resolution === 3840 ? "8K Resolution (7680x4320)" : "4K Resolution (3840x2160)";
                        promptParts.push(`
                            /// PRIORITY 2: ${targetRes} & OPTICAL SHARPENING ///
                            
                            A. SHARPENING ALGORITHM (V2.96):
                               - Apply "Unsharp Mask" logic: Amount: 150%, Radius: 0.8px, Threshold: 0.
                               - EDGES: Enhance high-frequency edge contrast significantly.
                               - CLARITY: Boost local micro-contrast to simulate a high-quality camera lens.
                               
                            B. TEXTURE RECONSTRUCTION (TACTILE REALISM):
                               - SKIN: Render individual pore depth (Shadow/Highlight). Must show vellus hair (peach fuzz) and skin ridges. NO PLASTIC SKIN.
                               - MATERIALS: If fabric, show the weave gaps. If metal, show brushed texture.
                               - NOISE: Inject film grain (ISO 200) to ensure the image looks like a raw photograph, not a digital painting.
                               
                            C. OUTPUT CONSTRAINT:
                               - Do not downscale. Output maximum requested density.
                               - The result must be razor-sharp.
                        `);
                    } else {
                        promptParts.push(`Maintain original resolution (${resolution}px width) and details. Just process the watermark removal if requested.`);
                    }

                    promptParts.push("Output the processed image directly without text.");
                    const finalPrompt = promptParts.join("\n");
                    const base64Data = originalImage.split(',')[1];

                    console.log("Calling Gemini API (V2.96)...");
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${currentKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: finalPrompt },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);
                    // 備註：此處為了相容舊版邏輯不進行深度解析，僅執行 Canvas 渲染
                    
                    renderCanvasOutput();
                } catch (error) {
                    console.error(error);
                    alert(`API 處理失敗: ${error.message}\n將切換至本地渲染模式。`);
                    renderCanvasOutput();
                }
            } else {
                renderCanvasOutput();
            }
          };

          const renderCanvasOutput = () => {
              const img = new Image();
              img.src = originalImage;
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const targetWidth = resolution;
                const scaleFactor = targetWidth / img.width;
                const targetHeight = Math.round(img.height * scaleFactor);
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                const filter = getPreviewFilter();
                ctx.filter = filter;
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                ctx.filter = 'none';

                if (mode === 'finetune' || mode === 'optimize') {
                    ctx.globalCompositeOperation = 'overlay';
                    ctx.globalAlpha = mode === 'finetune' ? 0.22 : 0.40;
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                const noiseCanvas = document.createElement('canvas');
                noiseCanvas.width = targetWidth;
                noiseCanvas.height = targetHeight;
                const nCtx = noiseCanvas.getContext('2d');
                const imgData = nCtx.createImageData(targetWidth, targetHeight);
                const buffer = new Uint32Array(imgData.data.buffer);
                for (let i = 0; i < buffer.length; i++) {
                    const v = (Math.random() * 255) | 0;
                    buffer[i] = (255 << 24) | (v << 16) | (v << 8) | v;
                }
                nCtx.putImageData(imgData, 0, 0);
                
                ctx.globalCompositeOperation = 'overlay';
                if (mode === 'restore') ctx.globalAlpha = 0.08;
                else if (mode === 'finetune') ctx.globalAlpha = 0.12;
                else ctx.globalAlpha = 0.15;
                ctx.drawImage(noiseCanvas, 0, 0);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                const link = document.createElement('a');
                link.download = getTimestampFilename(mode, enableAI, removeWatermark);
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setIsExporting(false);
              };
          };

          // --- Interaction ---
          const handleWheel = (e) => {
            if (step !== 'result') return;
            e.preventDefault();
            const delta = e.deltaY * -0.001;
            const newZoom = Math.min(Math.max(1, zoom + delta * 5), 8);
            setZoom(newZoom);
            if (newZoom === 1) setPan({ x: 0, y: 0 });
          };

          const handleMouseDown = (e) => {
            if (step !== 'result') return;
            setIsDraggingImage(true);
            setIsComparing(true);
            dragStartRef.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
          };

          const handleMouseMove = useCallback((e) => {
            if (isDraggingImage) {
              e.preventDefault();
              setPan({ x: e.clientX - dragStartRef.current.x, y: e.clientY - dragStartRef.current.y });
            }
          }, [isDraggingImage]);

          const handleMouseUp = () => {
            setIsDraggingImage(false);
            setIsComparing(false);
          };

          useEffect(() => {
            if (isDraggingImage) {
              window.addEventListener('mousemove', handleMouseMove);
              window.addEventListener('mouseup', handleMouseUp);
              window.addEventListener('mouseleave', handleMouseUp);
              return () => {
                window.removeEventListener('mousemove', handleMouseMove);
                window.removeEventListener('mouseup', handleMouseUp);
                window.removeEventListener('mouseleave', handleMouseUp);
              };
            }
          }, [handleMouseMove, isDraggingImage]);

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
              const img = new Image();
              img.onload = () => {
                setImgDimensions({ w: img.width, h: img.height });
                setOriginalImage(evt.target.result);
                setStep('processing');
                startSimulation();
              };
              img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
          };

          const startSimulation = () => {
            setProgress(0);
            const interval = setInterval(() => {
              setProgress(prev => {
                if (prev >= 100) {
                  clearInterval(interval);
                  setStep('result');
                  return 100;
                }
                return prev + 2;
              });
            }, 30);
          };

          const resetAll = () => {
            setOriginalImage(null);
            setStep('upload');
            setZoom(1);
            setPan({ x: 0, y: 0 });
            setIsComparing(false);
          };

          return (
            <div className="min-h-screen flex flex-col overflow-hidden select-none no-select">
              
              <div className="p-4 bg-[#0b0e14]">
                  <div className="v14-section" style={{ borderColor: 'var(--secondary)' }}>
                      <div className="v14-label">🔑 API 金鑰管理 (API.txt Logic)</div>
                      <div className="v14-row">
                          <div className="v14-col" style={{ flex:1 }}>
                              <select id="savedKeys" className="v14-select" onChange={handleLoadKey}>
                                  <option value="">-- 選擇已存的金鑰 --</option>
                                  {Object.keys(savedKeys).map(name => (
                                      <option key={name} value={savedKeys[name]}>{name}</option>
                                  ))}
                              </select>
                          </div>
                          <div className="v14-col" style={{ flex:2 }}>
                              <input type="password" className="v14-input" placeholder="輸入 Google AI Studio Key (AIza...)" value={currentKey} onChange={(e) => setCurrentKey(e.target.value)} />
                          </div>
                          <div className="v14-col" style={{ flex:1 }}>
                              <input type="text" className="v14-input" placeholder="給這個 Key 一個名稱" value={keyName} onChange={(e) => setKeyName(e.target.value)} />
                          </div>
                          <div className="v14-col" style={{ flex:0.5 }}>
                              <button className="v14-btn v14-btn-save" onClick={handleSaveKey}>{Icons.Save} 儲存</button>
                          </div>
                          <div className="v14-col" style={{ flex:0.5 }}>
                              <button className="v14-btn v14-btn-del" onClick={handleDeleteKey}>{Icons.Trash2} 刪除</button>
                          </div>
                      </div>
                      
                      <div className="v14-row">
                           <div className="v14-col" style={{ flex:0.8 }}>
                                <button className="v14-btn v14-btn-scan" onClick={scanModels}>{Icons.Search} 1. 掃描可用模型</button>
                          </div>
                          <div className="v14-col" style={{ flex:1.5 }}>
                              <select className="v14-select" value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)}>
                                  {modelList.length === 0 ? <option value="gemini-1.5-flash">Gemini 1.5 Flash (預設)</option> : modelList.map(m => <option key={m} value={m}>{m}</option>)}
                              </select>
                          </div>
                      </div>
                      <div style={{ fontSize:'12px', color:'#8b949e', marginTop:'5px' }}>
                          <span className={`status-dot ${apiStatus === 'ready' ? 'status-ok' : apiStatus === 'error' ? 'status-error' : ''}`}></span> 
                          {apiStatus === 'idle' ? '等待操作' : apiStatus === 'scanning' ? '掃描中...' : apiStatus === 'ready' ? 'API 就緒' : '發生錯誤'}
                      </div>
                  </div>
              </div>

              <header className="h-16 bg-[#161616] border-b border-[#2A2A2A] flex items-center justify-between px-6 z-50 shrink-0">
                <div className="flex items-center gap-3">
                  <div className="bg-gradient-to-br from-purple-600 to-blue-600 p-1.5 rounded-lg shadow-lg shadow-purple-900/20">
                    <div className="text-white">{Icons.Sparkles}</div>
                  </div>
                  <div>
                    <h1 className="text-lg font-bold tracking-tight text-white leading-none">UltraScale <span className="text-purple-400">AI</span></h1>
                    <div className="text-[10px] font-mono text-gray-500 tracking-wider mt-0.5">V2.96 PRO API</div>
                  </div>
                </div>
                
                {step === 'result' && (
                     <button onClick={resetAll} className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#252525] hover:bg-[#303030] text-xs text-gray-300 transition-colors border border-white/5">
                        {Icons.Plus} <span>新增影像</span>
                     </button>
                )}
              </header>

              <main className="flex-1 relative flex flex-col overflow-hidden bg-[#101010]">
                {step === 'upload' && (
                  <div className="flex-1 flex flex-col items-center justify-center p-6 animate-fade-in">
                      <div className="w-full max-w-2xl bg-[#1A1A1A] border border-[#2A2A2A] rounded-2xl p-12 text-center relative group overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-600 via-blue-500 to-purple-600 opacity-50"></div>
                        <div className="relative z-10 flex flex-col items-center">
                            <div className="w-20 h-20 bg-[#252525] rounded-2xl flex items-center justify-center mb-6 shadow-inner group-hover:scale-105 transition-transform duration-300">
                                <div className="text-gray-400 group-hover:text-purple-400 transition-colors scale-150">
                                   {Icons.Upload}
                                </div>
                            </div>
                            <h2 className="text-2xl font-bold text-white mb-3">載入影像以開始重建</h2>
                            <p className="text-gray-500 mb-8 max-w-md mx-auto">支援 RAW, JPG, PNG • 4K 紋理合成引擎已就緒</p>
                            <label className="relative cursor-pointer">
                                <input type="file" className="hidden" accept="image/*" onChange={handleFileUpload} />
                                <div className="bg-white hover:bg-gray-100 text-black px-8 py-3 rounded-lg font-bold transition-all transform active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.1)]">選擇檔案</div>
                            </label>
                        </div>
                     </div>
                  </div>
                )}

                {step === 'processing' && (
                   <div className="flex-1 flex flex-col items-center justify-center p-6">
                      <div className="relative w-32 h-32 flex items-center justify-center mb-8">
                         <svg className="absolute inset-0 w-full h-full animate-spin-slow" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" stroke="#2A2A2A" strokeWidth="4" fill="none" />
                            <circle cx="50" cy="50" r="45" stroke="#8B5CF6" strokeWidth="4" fill="none" strokeDasharray="280" strokeDashoffset={280 - (280 * progress) / 100} strokeLinecap="round" />
                         </svg>
                         <div className="text-2xl font-bold text-white">{progress}%</div>
                      </div>
                      <h2 className="text-xl font-bold text-white mb-2">正在進行神經網路重建...</h2>
                   </div>
                )}

                {step === 'result' && originalImage && (
                    <div className="flex-1 flex flex-col h-full">
                        <div className="flex-1 relative bg-[#0A0A0A] overflow-hidden group cursor-grab active:cursor-grabbing"
                             onWheel={handleWheel}
                             onMouseDown={handleMouseDown}
                             ref={containerRef}
                        >
                            <div className="w-full h-full flex items-center justify-center origin-center will-change-transform" style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})` }}>
                                <div className="relative shadow-2xl" style={{ maxWidth: '90%', maxHeight: '90%' }}>
                                    <img src={originalImage} alt="Original" className="block max-w-full max-h-[80vh] object-contain pointer-events-none" draggable="false" />
                                    <div className={`absolute inset-0 pointer-events-none transition-opacity duration-200 ${isComparing ? 'opacity-0' : 'opacity-100'}`}>
                                        <img src={originalImage} alt="Processed" className="w-full h-full object-contain" style={{ filter: getPreviewFilter() }} draggable="false" />
                                        <div className="absolute inset-0 bg-noise opacity-10 mix-blend-overlay pointer-events-none"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="absolute top-6 right-6 flex flex-col items-center gap-2 pointer-events-none z-50">
                                <div className="bg-black/60 backdrop-blur-md p-2 rounded-lg border border-white/10 shadow-lg">
                                    <div className="text-white">{Icons.BeforeAfter}</div>
                                </div>
                                <div className="text-[10px] text-white/70 font-bold bg-black/40 px-2 py-0.5 rounded-full backdrop-blur-sm">長按對比</div>
                            </div>

                            {zoom > 1 && (
                                <div className="absolute top-4 left-4 bg-black/70 backdrop-blur px-3 py-1.5 rounded-full text-xs font-bold text-white border border-white/10 pointer-events-none flex items-center gap-2">
                                   {Icons.ZoomIn} {Math.round(zoom * 100)}%
                                </div>
                            )}
                        </div>

                        <div className="h-auto bg-[#161616] border-t border-[#2A2A2A] p-4 md:px-8 flex flex-col gap-4 z-40 shrink-0">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div className={`relative p-3 rounded-xl border text-left transition-all cursor-pointer ${mode === 'restore' ? 'bg-[#252525] border-blue-500' : 'bg-[#1A1A1A] border-[#2A2A2A] hover:bg-[#202020]'}`} onClick={() => setMode('restore')}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <div className={`p-1 rounded-md ${mode === 'restore' ? 'bg-blue-500/20 text-blue-400' : 'bg-[#333] text-gray-500'}`}>{Icons.Shield}</div>
                                        <span className={`text-sm font-bold ${mode === 'restore' ? 'text-white' : 'text-gray-400'}`}>還原 (Restore)</span>
                                    </div>
                                    <p className="text-[10px] text-gray-500 leading-tight">100% 原圖調性。僅進行紋理注入。</p>
                                </div>

                                <div className={`relative p-3 rounded-xl border text-left transition-all cursor-pointer ${mode === 'finetune' ? 'bg-[#252525] border-purple-500' : 'bg-[#1A1A1A] border-[#2A2A2A] hover:bg-[#202020]'}`} onClick={() => setMode('finetune')}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <div className={`p-1 rounded-md ${mode === 'finetune' ? 'bg-purple-500/20 text-purple-400' : 'bg-[#333] text-gray-500'}`}>{Icons.Activity}</div>
                                        <span className={`text-sm font-bold ${mode === 'finetune' ? 'text-white' : 'text-gray-400'}`}>微調 (Fine-tune)</span>
                                    </div>
                                    <p className="text-[10px] text-gray-500 leading-tight">極微量優化對比與亮度 (1.02x)。</p>
                                </div>

                                <div className={`relative p-3 rounded-xl border text-left transition-all cursor-pointer ${mode === 'optimize' ? 'bg-[#252525] border-pink-500' : 'bg-[#1A1A1A] border-[#2A2A2A] hover:bg-[#202020]'}`} onClick={() => setMode('optimize')}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <div className={`p-1 rounded-md ${mode === 'optimize' ? 'bg-pink-500/20 text-pink-400' : 'bg-[#333] text-gray-500'}`}>{Icons.Zap}</div>
                                        <span className={`text-sm font-bold ${mode === 'optimize' ? 'text-white' : 'text-gray-400'}`}>優化 (Optimize)</span>
                                    </div>
                                    <p className="text-[10px] text-gray-500 leading-tight">高對比通透感 + 深度銳化。</p>
                                </div>
                            </div>

                            <div className="bg-[#101010] p-3 rounded-xl border border-[#2A2A2A] flex flex-col lg:flex-row items-center gap-4">
                                <div className="flex items-center gap-3 text-xs text-gray-400 px-2 flex-1 w-full lg:w-auto flex-wrap">
                                     <div className="flex flex-col border-r border-white/10 pr-4 mr-2">
                                        <div className="flex items-center gap-2">
                                            <input type="checkbox" id="ai-upgrade" disabled={apiStatus !== 'ready'} checked={enableAI} onChange={(e) => setEnableAI(e.target.checked)} className="accent-blue-500 cursor-pointer" />
                                            <label htmlFor="ai-upgrade" className={`cursor-pointer flex items-center gap-1 font-bold ${apiStatus==='ready' ? 'text-blue-400' : 'text-gray-600'}`}>
                                                {Icons.Bot} AI 極致細節升級 (V2.96 Spec)
                                            </label>
                                        </div>
                                        <div className="text-[9px] text-gray-500 mt-0.5 ml-5 max-w-[300px]">
                                            (偵測人像)高階肌膚物理(SSS)、銳化(USM)、無磨皮
                                        </div>
                                     </div>

                                     <div className="flex flex-col border-r border-white/10 pr-4 mr-2">
                                        <div className="flex items-center gap-2">
                                            <input type="checkbox" id="rm-watermark" disabled={apiStatus !== 'ready'} checked={removeWatermark} onChange={(e) => setRemoveWatermark(e.target.checked)} className="accent-red-500 cursor-pointer" />
                                            <label htmlFor="rm-watermark" className={`cursor-pointer flex items-center gap-1 ${apiStatus==='ready' ? 'text-gray-300' : 'text-gray-600'}`}>
                                                {Icons.Eraser} 智能移除浮水印
                                            </label>
                                        </div>
                                        <div className="text-[9px] text-gray-500 mt-0.5 ml-5">
                                            使用 Nano Banana 破壞性重繪 (V2.96 API)
                                        </div>
                                     </div>

                                     {Icons.Monitor} 
                                     <div className="flex bg-[#222] rounded p-0.5">
                                         <button onClick={() => setResolution(2048)} className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all ${resolution === 2048 ? 'bg-gray-600 text-white' : 'text-gray-500 hover:text-gray-300'}`}>2K</button>
                                         <button onClick={() => setResolution(3840)} className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all ${resolution === 3840 ? 'bg-gray-600 text-white' : 'text-gray-500 hover:text-gray-300'}`}>4K</button>
                                     </div>
                                     <span className="text-gray-600">|</span>
                                     {Icons.FileImage}
                                     <div className="flex bg-[#222] rounded p-0.5">
                                         <button className="px-2 py-0.5 rounded text-[10px] font-bold bg-gray-600 text-white cursor-default">JPG</button>
                                     </div>
                                </div>
                                <button onClick={renderAndDownload} disabled={isExporting} className="w-full lg:w-auto bg-white hover:bg-gray-200 text-black px-6 py-2.5 rounded-lg font-bold shadow-lg shadow-white/5 transition-all active:scale-95 flex items-center justify-center gap-2 min-w-[200px]">
                                    {isExporting ? <><div className="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div> 渲染中...</> : <>{Icons.Download} 下載成果</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
              </main>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
